tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: Delete an existing contact by its ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      format: ObjectId
      example: '507f1f77bcf86cd799439011'
    description: The unique identifier of the contact to delete
responses:
  '204':
    description: Contact successfully deleted (No Content)
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
            data:
              type: string
              example: 'Contact not found'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Internal server error'
            data:
              type: string
              example: 'Internal server error'
